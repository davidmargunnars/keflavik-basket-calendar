name: Update Keflavik Basketball Calendar

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "update_calendar.py"
      - ".github/workflows/update.yml"

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser tooling
        run: python -m pip install --disable-pip-version-check selenium

      - name: Update calendar
        run: python update_calendar.py

      - name: Commit calendar if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keflavik-basket.ics
          if git diff --cached --quiet; then
            echo "No calendar changes"
          else
            git commit -m "Update Keflavik basketball calendar"
            git push
          fi
